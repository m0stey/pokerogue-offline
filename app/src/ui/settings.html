<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'" />
    <title>PokéRogue</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1d1d20;
        --muted: #5a5a63;
        --line: #d9d9e0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 16px 22px 16px;
        font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        background: #f7f7fa;
      }
      h1 { font-size: 19px; margin: 0 0 12px; }
      section {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 15px;
        margin-bottom: 10px;
      }
      h2 { font-size: 15px; margin: 0 0 8px; }
      label.choice { display: flex; align-items: flex-start; gap: 9px; padding: 2px 0; }
      input[type="radio"] { margin-top: 5px; width: 16px; height: 16px; }
      .rows { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; }
      .rows .k { color: var(--muted); }
      .path { word-break: break-all; color: var(--muted); font-size: 13px; margin: 4px 0 8px; }
      button {
        font: inherit;
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #fff;
        cursor: pointer;
      }
      button:hover { background: #f0f0f4; }
      p.footnote { color: var(--muted); margin: 2px 2px 0; font-size: 14px; }
    </style>
  </head>
  <body>
    <h1 id="t-heading"></h1>

    <section>
      <h2 id="t-conflict-heading"></h2>
      <label class="choice"><input type="radio" name="conflict" value="ask" /> <span id="t-conflict-ask"></span></label>
      <label class="choice"><input type="radio" name="conflict" value="prefer-this-computer" /> <span id="t-conflict-here"></span></label>
      <label class="choice"><input type="radio" name="conflict" value="prefer-online" /> <span id="t-conflict-online"></span></label>
    </section>

    <section>
      <h2 id="t-backups-heading"></h2>
      <div class="path" id="backups-dir">—</div>
      <button id="open-backups"></button>
    </section>

    <section>
      <h2 id="t-about-heading"></h2>
      <div class="rows">
        <div class="k" id="t-game-version"></div>
        <div id="game-version">—</div>
        <div class="k" id="t-last-saved"></div>
        <div id="last-saved">—</div>
        <div class="k" id="t-play-time"></div>
        <div id="play-time">—</div>
      </div>
    </section>

    <p class="footnote" id="t-footnote"></p>

    <script src="settings.js"></script>
  </body>
</html>
