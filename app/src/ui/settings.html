<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'" />
    <title>PokeRogue Settings</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1d1d20;
        --muted: #5a5a63;
        --line: #d9d9e0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 16px 22px 16px;
        font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        background: #f7f7fa;
      }
      h1 { font-size: 19px; margin: 0 0 12px; }
      section {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 15px;
        margin-bottom: 10px;
      }
      h2 { font-size: 15px; margin: 0 0 8px; }
      label.choice { display: flex; align-items: flex-start; gap: 9px; padding: 2px 0; }
      input[type="radio"] { margin-top: 5px; width: 16px; height: 16px; }
      .rows { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; }
      .rows .k { color: var(--muted); }
      .path { word-break: break-all; color: var(--muted); font-size: 13px; margin: 4px 0 8px; }
      button {
        font: inherit;
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #fff;
        cursor: pointer;
      }
      button:hover { background: #f0f0f4; }
      p.footnote { color: var(--muted); margin: 2px 2px 0; font-size: 14px; }
    </style>
  </head>
  <body>
    <h1>PokeRogue Settings</h1>

    <section>
      <h2>If your progress is different here and online</h2>
      <label class="choice"><input type="radio" name="conflict" value="ask" /> Ask me which one to keep</label>
      <label class="choice"><input type="radio" name="conflict" value="prefer-this-computer" /> Always keep what is on this computer</label>
      <label class="choice"><input type="radio" name="conflict" value="prefer-online" /> Always keep what is online</label>
    </section>

    <section>
      <h2>On a mobile connection</h2>
      <label class="choice"><input type="radio" name="metered" value="ask" /> Ask before downloading game updates</label>
      <label class="choice"><input type="radio" name="metered" value="always" /> Always download</label>
      <label class="choice"><input type="radio" name="metered" value="never" /> Only download on Wi-Fi</label>
    </section>

    <section>
      <h2>Backups folder</h2>
      <div class="path" id="backups-dir">—</div>
      <button id="open-backups">Open folder</button>
    </section>

    <section>
      <h2>About your game</h2>
      <div class="rows">
        <div class="k">Game version</div>
        <div id="game-version">—</div>
        <div class="k">Last saved online</div>
        <div id="last-saved">—</div>
        <div class="k">Play Time</div>
        <div id="play-time">—</div>
      </div>
    </section>

    <p class="footnote">Your progress is saved online by itself. You do not have to do anything here.</p>

    <script src="settings.js"></script>
  </body>
</html>
