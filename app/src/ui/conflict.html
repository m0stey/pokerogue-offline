<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'" />
    <title>PokéRogue</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1d1d20;
        --muted: #5a5a63;
        --line: #d9d9e0;
        --accent: #d63031;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 22px 24px 18px;
        font: 15px/1.55 "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        background: #f7f7fa;
      }
      h1 { font-size: 20px; margin: 0 0 6px; }
      p.lead { margin: 0 0 18px; color: var(--muted); }
      .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .card {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        padding: 14px 16px 16px;
        display: flex;
        flex-direction: column;
      }
      .card h2 { font-size: 16px; margin: 0 0 10px; }
      dl { margin: 0 0 14px; }
      dt { font-size: 12px; text-transform: none; color: var(--muted); margin-top: 8px; }
      dd { margin: 0; font-size: 15px; }
      button {
        font: inherit;
        margin-top: auto;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button.secondary { background: #fff; color: var(--ink); border-color: var(--line); }
      button:hover { filter: brightness(1.05); }
      .note { margin: 16px 0 10px; color: var(--muted); }
      label.remember { display: flex; align-items: center; gap: 8px; }
      input[type="checkbox"] { width: 16px; height: 16px; }
    </style>
  </head>
  <body>
    <h1 id="t-heading"></h1>
    <p class="lead" id="t-lead"></p>

    <div class="cards">
      <section class="card">
        <h2 id="t-here"></h2>
        <dl>
          <dt id="t-playtime-here"></dt>
          <dd id="here-playtime">—</dd>
          <dt id="t-last-here"></dt>
          <dd id="here-last">—</dd>
          <dt id="here-run-label"></dt>
          <dd id="here-run">—</dd>
        </dl>
        <button id="keep-here"></button>
      </section>

      <section class="card">
        <h2 id="t-online"></h2>
        <dl>
          <dt id="t-playtime-online"></dt>
          <dd id="online-playtime">—</dd>
          <dt id="t-last-online"></dt>
          <dd id="online-last">—</dd>
          <dt id="online-run-label"></dt>
          <dd id="online-run">—</dd>
        </dl>
        <button id="keep-online" class="secondary"></button>
      </section>
    </div>

    <p class="note" id="t-note"></p>

    <label class="remember">
      <input type="checkbox" id="remember" />
      <span id="t-remember"></span>
    </label>

    <script src="conflict.js"></script>
  </body>
</html>
