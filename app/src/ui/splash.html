<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'" />
    <title>PokéRogue</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        display: grid;
        place-items: center;
        background: #1b1b1f;
        color: #f2f2f5;
        font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
        user-select: none;
      }
      .box { text-align: center; }
      .dots { margin-top: 12px; display: flex; gap: 7px; justify-content: center; }
      .dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #d63031;
        animation: pulse 1.1s ease-in-out infinite;
      }
      .dots span:nth-child(2) { animation-delay: 0.15s; }
      .dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes pulse {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div id="text"></div>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
    <script src="splash.js"></script>
  </body>
</html>
