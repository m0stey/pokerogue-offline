# Installer configuration (electron-builder 26).
#
# Shape of the shipped app:
#   PokeRogue-Setup-<version>.exe  ->  one click, per user, no questions, desktop + start menu icon
#   resources/game/                ->  the game build, copied in from ../game-build/dist/game
#   %APPDATA%\PokeRogue Offline\   ->  saves, backups, logs, updates (never touched by the installer)
#
# `signAndEditExecutable: false` keeps electron-builder from downloading winCodeSign, whose archive
# contains symlinks that fail to extract on Windows without developer mode. The build is unsigned
# either way (BRIEF.md accepts the one SmartScreen warning during setup), so nothing is lost except
# the rewritten exe metadata. Verified option name for electron-builder 26 in
# app-builder-lib/out/options/winOptions.d.ts.

appId: net.pokerogue.offline
productName: PokeRogue
copyright: MIT licensed; PokeRogue is by the PokeRogue team
asar: true
directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!**/*.map"

extraResources:
  - from: ../game-build/dist/game
    to: game

# Sets the exe description and icon (signAndEditExecutable is off, see above).
afterPack: scripts/after-pack.cjs

win:
  target:
    - nsis
  icon: build/icon.png
  signAndEditExecutable: false
  # Fixed name: the release workflow and the updater both look for exactly this file.
  artifactName: PokeRogue-Setup.exe

# The installer speaks German like everything else the user sees (DECISIONS.md 2026-09-13).
# `installerLanguages` picks which NSIS language files are compiled in, `language` is the LCID that
# decides which one is used (1031 = German - Germany). `multiLanguageInstaller` stays off so there is
# exactly one language and no selection dialog. Option names verified for electron-builder 26 in
# app-builder-lib/out/targets/nsis/nsisOptions.d.ts (lines 191-206).
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PokeRogue
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  installerLanguages: de_DE
  language: "1031"
  multiLanguageInstaller: false
  displayLanguageSelector: false
