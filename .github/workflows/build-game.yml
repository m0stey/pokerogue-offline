# Builds the unmodified upstream PokeRogue client configured for the PokeRogue Offline wrapper
# (login enabled, API base http://127.0.0.1:47830/api) and publishes it as a GitHub release.
#
# Windows equivalent: game-build/build-game.ps1 (keep the two in sync).
name: Build Game

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build (e.g. v1.12.0.11). Empty = newest upstream release."
        required: false
        default: "v1.12.0.11"
  schedule:
    # Daily at 04:17 UTC. Builds the newest upstream release tag if we have not built it yet.
    - cron: "17 4 * * *"

concurrency:
  group: build-game
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_REPO: pagefaultgames/pokerogue
  SERVER_URL: http://127.0.0.1:47830/api
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve tag to build
        id: resolve
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          if [ -z "$tag" ]; then
            tag=$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq '.tag_name')
            echo "Newest upstream release: $tag"
          fi
          case "$tag" in
            v*) ;;
            *) echo "::error::Refusing to build non-release tag '$tag'"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # On the schedule, skip a tag we already published. Manual runs always rebuild.
          skip=false
          if [ '${{ github.event_name }}' = 'schedule' ] && gh release view "game-$tag" >/dev/null 2>&1; then
            echo "Release game-$tag already exists - nothing to do."
            skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream at tag
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ steps.resolve.outputs.tag }}
          # `locales` is required for the build; `assets` is the entire game payload.
          submodules: recursive

      - uses: pnpm/action-setup@v4
        if: steps.resolve.outputs.skip != 'true'

      - uses: actions/setup-node@v5
        if: steps.resolve.outputs.skip != 'true'
        with:
          node-version: "24"
          cache: pnpm

      - name: Write .env.offline
        if: steps.resolve.outputs.skip != 'true'
        run: |
          set -euo pipefail
          discord=$(grep -m1 '^VITE_DISCORD_CLIENT_ID=' .env.production | tr -d '\r')
          google=$(grep -m1 '^VITE_GOOGLE_CLIENT_ID=' .env.production | tr -d '\r')
          test -n "$discord" && test -n "$google"
          cat > .env.offline <<EOF
          # Generated by .github/workflows/build-game.yml - login ENABLED, API base = wrapper proxy.
          VITE_BYPASS_LOGIN=0
          VITE_BYPASS_TUTORIAL=0
          VITE_SERVER_URL=$SERVER_URL
          $discord
          $google
          VITE_I18N_DEBUG=0
          EOF
          cat .env.offline

      - name: Install
        if: steps.resolve.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.resolve.outputs.skip != 'true'
        run: pnpm vite build --mode offline

      - name: Verify bundle
        if: steps.resolve.outputs.skip != 'true'
        run: |
          set -uo pipefail
          fail() { echo "::error::$1"; exit 1; }
          test -f dist/index.html || fail "no dist/index.html"

          grep -qF "$SERVER_URL" dist/assets/*.js || fail "API base $SERVER_URL missing from bundle"
          if grep -q 'api\.pokerogue\.net' dist/assets/*.js; then fail "api.pokerogue.net present in bundle"; fi
          if grep -q 'VITE_BYPASS_LOGIN' dist/assets/*.js; then fail "VITE_BYPASS_LOGIN was not substituted"; fi

          # bypassLogin folds to a constant and its name disappears from the bundle, so check its
          # effects instead: with bypassLogin === true these call sites are eliminated.
          for ep in /account/login /account/info /savedata/system/get /savedata/system/update /savedata/updateall; do
            grep -qF -- "$ep" dist/assets/*.js || fail "endpoint $ep missing - bypassLogin may be true"
          done

          grep -q 'src="\./assets/' dist/index.html || fail "index.html does not use relative ./assets/ paths"

          for f in dist/manifest.webmanifest dist/service-worker.js dist/locales/en/common.json \
                   dist/images dist/audio dist/fonts; do
            test -e "$f" || { echo "::error::missing $f"; exit 1; }
          done
          echo "Bundle verified."

      - name: Package
        if: steps.resolve.outputs.skip != 'true'
        id: package
        run: |
          set -euo pipefail
          tag='${{ steps.resolve.outputs.tag }}'
          sha=$(git rev-parse HEAD)
          version=$(node -p "require('./package.json').version")

          jq -n --arg tag "$tag" --arg sha "$sha" --arg version "$version" \
                --arg serverUrl "$SERVER_URL" --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                '{tag:$tag, upstreamSha:$sha, gameVersion:$version, serverUrl:$serverUrl, builtAt:$builtAt}' \
                > version.json
          cat version.json
          # The app reads <gameDir>/version.json, so it ships inside the zip too.
          cp version.json dist/version.json

          # -1: the payload is ~80% pre-compressed mp3/png; deflate buys almost nothing.
          (cd dist && zip -qr -1 ../game.zip .)
          sha256sum game.zip | awk '{print $1"  game.zip"}' > game.zip.sha256
          ls -lh game.zip game.zip.sha256 version.json
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Publish release game-${{ steps.resolve.outputs.tag }}
        if: steps.resolve.outputs.skip != 'true'
        run: |
          set -euo pipefail
          tag='${{ steps.resolve.outputs.tag }}'
          rel="game-$tag"
          cat > notes.md <<EOF
          Unmodified upstream [\`$UPSTREAM_REPO@$tag\`](https://github.com/$UPSTREAM_REPO/releases/tag/$tag)
          (\`${{ steps.package.outputs.sha }}\`) built for the PokeRogue Offline wrapper.

          * \`VITE_BYPASS_LOGIN=0\` — login enabled
          * \`VITE_SERVER_URL=$SERVER_URL\`

          Verify with \`sha256sum -c game.zip.sha256\`.
          EOF

          if gh release view "$rel" >/dev/null 2>&1; then
            gh release upload "$rel" game.zip game.zip.sha256 version.json --clobber
            gh release edit "$rel" --notes-file notes.md
          else
            gh release create "$rel" game.zip game.zip.sha256 version.json \
              --title "$rel" --notes-file notes.md
          fi

      - name: Keep only the 3 newest game releases
        if: steps.resolve.outputs.skip != 'true'
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("game-"))]
                  | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
            | while read -r old; do
                [ -n "$old" ] || continue
                echo "Deleting old release $old"
                gh release delete "$old" --yes --cleanup-tag
              done
