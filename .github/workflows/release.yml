# Builds the complete Windows installer (app + game) and publishes it as a GitHub release.
# The installed app checks these releases on every start and updates itself (app/src/main/updater.ts).
#
# Release tag:  release-<upstream game tag>-app<app version>, e.g. release-v1.12.0.11-app0.1.0
# Assets:       PokeRogue-Setup.exe, PokeRogue-Setup.exe.sha256, release.json {gameTag, appVersion}
#
# Two jobs on purpose. `build` runs upstream PokeRogue's own build (pnpm install, vite) and therefore
# gets a read-only token that is not even kept in the checkout. Only `publish`, which runs no
# third-party code, can write releases.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream game tag (e.g. v1.12.0.11). Empty = newest upstream release."
        required: false
        default: ""
  schedule:
    - cron: "17 */4 * * *"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_REPO: pagefaultgames/pokerogue

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      app: ${{ steps.resolve.outputs.app }}
      rel: ${{ steps.resolve.outputs.rel }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve versions
        id: resolve
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = '${{ inputs.tag }}'
          if (-not $tag) { $tag = gh api "repos/$env:UPSTREAM_REPO/releases/latest" --jq '.tag_name' }
          if ($tag -notmatch '^v\d+(\.\d+){2,3}$') { throw "Refusing to build non-release tag '$tag'" }
          $appVersion = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          $rel = "release-$tag-app$appVersion"
          gh release view $rel *> $null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          $skip = $exists -and ('${{ github.event_name }}' -eq 'schedule')
          Write-Host "game $tag, app $appVersion, release $rel, exists=$exists, skip=$skip"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "app=$appVersion" >> $env:GITHUB_OUTPUT
          "rel=$rel" >> $env:GITHUB_OUTPUT
          "skip=$($skip.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v5
        if: steps.resolve.outputs.skip != 'true'
        with:
          node-version: "24"

      - name: Install pnpm
        if: steps.resolve.outputs.skip != 'true'
        shell: pwsh
        run: npm install -g pnpm@10.34.5

      - name: Build game
        if: steps.resolve.outputs.skip != 'true'
        shell: powershell
        run: ./game-build/build-game.ps1 -Tag '${{ steps.resolve.outputs.tag }}' -NoZip

      - name: Check the game calls no unreviewed server routes
        if: steps.resolve.outputs.skip != 'true'
        shell: pwsh
        run: node game-build/check-api-routes.mjs game-build/work/pokerogue

      - name: Test and build installer
        if: steps.resolve.outputs.skip != 'true'
        shell: pwsh
        working-directory: app
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run
          npm run dist
          if (-not (Test-Path release/PokeRogue-Setup.exe)) { throw "installer missing" }

      - uses: actions/upload-artifact@v4
        if: steps.resolve.outputs.skip != 'true'
        with:
          name: installer
          path: app/release/PokeRogue-Setup.exe
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: out

      - name: Package release files
        shell: pwsh
        working-directory: out
        run: |
          $hash = (Get-FileHash PokeRogue-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  PokeRogue-Setup.exe" | Set-Content -NoNewline -Encoding ascii PokeRogue-Setup.exe.sha256
          @{ gameTag = '${{ needs.build.outputs.tag }}'; appVersion = '${{ needs.build.outputs.app }}' } |
            ConvertTo-Json | Set-Content -Encoding utf8NoBOM release.json
          Get-ChildItem | Format-Table Name, Length

      - name: Publish
        shell: pwsh
        working-directory: out
        run: |
          $rel = '${{ needs.build.outputs.rel }}'
          gh release view $rel *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete $rel --yes --cleanup-tag }
          $global:LASTEXITCODE = 0
          gh release create $rel PokeRogue-Setup.exe PokeRogue-Setup.exe.sha256 release.json `
            --title "PokeRogue ${{ needs.build.outputs.tag }} (App ${{ needs.build.outputs.app }})" `
            --notes "Kompletter Installer. Die installierte App aktualisiert sich damit von selbst."
          # Keep the three newest releases.
          $old = gh release list --limit 50 --json tagName,createdAt | ConvertFrom-Json |
            Where-Object { $_.tagName -like 'release-*' } | Sort-Object createdAt -Descending | Select-Object -Skip 3
          foreach ($r in $old) { gh release delete $r.tagName --yes --cleanup-tag }
